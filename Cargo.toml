[package]
name = "modtree"
version = "0.1.0"
edition = "2024"
authors = ["UlquiorraCode Contributors"]
license = "MIT OR Apache-2.0"
description = "Ultra-fast zero-allocation hierarchical modular routing & tree composition engine in Rust"
readme = "README.md"
repository = "https://github.com/ulquiorracode/modtree-rs"

[dependencies]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "baseline_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
