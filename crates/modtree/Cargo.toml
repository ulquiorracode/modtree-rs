[package]
name = "modtree"
version = "0.2.0"
edition = "2024"
authors = ["UlquiorraCode Contributors"]
license = "MIT OR Apache-2.0"
description = "Ultra-fast zero-allocation hierarchical modular routing & tree composition engine in Rust"
readme = "../../README.md"
repository = "https://github.com/ulquiorracode/modtree-rs"

[features]
default = ["std", "derive", "macros", "builder"]
std = ["modtree-core/std"]
alloc = ["modtree-core/alloc"]
builder = ["modtree-core/builder"]
derive = ["dep:modtree-derive"]
macros = ["derive"]

[dependencies]
modtree-core = { path = "../modtree-core", version = "0.2.0", default-features = false }
modtree-derive = { path = "../modtree-derive", version = "0.2.0", optional = true }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "baseline_bench"
harness = false
